[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawffyfish"
version = "0.1.0"
authors = [
    { name="Aarav Patel", email="aaravpatel14.in@gmail.com" }
]
description = "A specialized Lichess bot built to play for tight, calculated draws."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "chess==1.10.0",
    "requests",
]

[project.scripts]
drawffyfish-bot = "drawffyfish.bot:main"  # Runs the "main()" function inside drawffyfish/bot.py

[tool.setuptools.include-package-data]
keep-default-manifest = true

# Update your script path since there is no inner "drawffyfish" folder:

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
drawffyfish-bot = "drawffyfish.bot:main"

