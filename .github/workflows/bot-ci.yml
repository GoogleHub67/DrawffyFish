name: Drawffyfish Continuous Integration Platform

on:
  push:
    branches: [ main ]

jobs:
  build-and-verify-packaging:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Target Assets Repository
      uses: actions/checkout@v4

    - name: Initialize Deployment Environment Sandbox
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build Manifest Matrix Architecture Checks
      run: |
        if [ ! -f "requirements.txt" ]; then
          echo "[ERROR] Missing application requirements manifest!" && exit 1
        fi
        if [ ! -f "config.yml.default" ]; then
          echo "[ERROR] Missing fallback configuration template layout profile!" && exit 1
        fi
        echo "[SUCCESS] Core packaging validation assets verified cleanly."
